name: everbloom
description: A flower marketplace connecting customers with local florists
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter

  provider: ^6.0.5
  intl: ^0.18.1
  image_picker: ^1.0.4

  # Firebase
  firebase_core: ^2.30.0

  # Map & Location
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^13.0.0

  # HTTP
  http: ^1.2.0
  lucide_icons: ^0.257.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"